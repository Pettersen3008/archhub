name: Arch checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    runs-on: ubuntu-latest
    # Test the rolling Arch ABI rather than building against Ubuntu's libalpm.
    container: archlinux:base-devel
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      PLAYWRIGHT_BROWSER: firefox
    steps:
      - name: Install build and check tools in the disposable container
        run: pacman -Syu --noconfirm --needed git rust bun pkgconf gtk3 webkit2gtk-4.1 python zstd desktop-file-utils cargo-audit nss alsa-lib
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source and generated IPC contract
        run: |
          bun run check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          bun run bindings
          git diff --exit-code -- src/lib/ipc/bindings.ts
      - name: Audit language dependencies
        run: |
          bun audit
          cargo audit
      - name: Build frontend and test local failure paths
        run: |
          bun run build
          bunx playwright install firefox
          bun run test:release
      - name: Build standard Arch packages as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd "$GITHUB_WORKSPACE" && python3 scripts/prepare-release.py && cd artifacts/release && makepkg --cleanbuild --noconfirm'
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archhub-arch-build
          path: |
            artifacts/release/archhub-*.pkg.tar.zst
            artifacts/release/archhub-*.tar.gz
            artifacts/release/PKGBUILD
            artifacts/release/.SRCINFO
            artifacts/release/source.json
            artifacts/release/SHA256SUMS
            test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
