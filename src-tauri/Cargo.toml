[package]
name = "archhub-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
archhub-core = { path = "../crates/archhub-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
tempfile = "3.27"
tokio = { version = "1", features = ["io-util", "process", "sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
[lints]
workspace = true
